server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy — forwards /apps/* to the platform API service
    # This is how the dashboard reaches the API when both run in-cluster
    location /apps {
        proxy_pass http://platform-api.platform.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://platform-api.platform.svc.cluster.local;
    }

    # React Router — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
