name: Platform API CI

on:
  push:
    branches: [main]
    paths:
      - 'platform-api/**'
      - '.github/workflows/platform-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'platform-api/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd platform-api
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          cd platform-api
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./platform-api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeflow-platform-api:latest
            ghcr.io/${{ github.repository_owner }}/kubeflow-platform-api:${{ github.sha }}
